<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#06121a" />
  <title>Page not found, Solar Drift</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <style>
    html, body { margin: 0; height: 100%; }
    body { display: grid; place-items: center; padding: 24px; box-sizing: border-box; background: radial-gradient(circle at 60% 45%, #14303a, #0b1f29 42%, #06121a); color: #e9f2ec; -webkit-font-smoothing: antialiased; font-family: ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
    main { max-width: 440px; }
    h1 { font-size: clamp(44px, 9vw, 72px); font-weight: 250; line-height: .95; letter-spacing: -.05em; margin: 0 0 20px; }
    p { color: #a3bdb6; font-size: 17px; line-height: 1.55; margin: 0 0 30px; }
    a { display: inline-flex; align-items: center; min-height: 54px; padding: 0 30px; border-radius: 27px; background: #ffc46e; color: #2a1503; text-decoration: none; font-weight: 600; font-size: 17px; }
    a:hover { background: #ffe3b0; }
    a:focus-visible { outline: 2px solid #8eead0; outline-offset: 4px; }
  </style>
</head>
<body>
  <main>
    <h1>This page drifted out of range</h1>
    <p>There is nothing at this address. The game is one click away.</p>
    <a id="home" href="/">Back to Solar Drift</a>
  </main>
  <script>
    // The GitHub Pages copy lives under /solar-drift/ rather than at the domain root.
    if (location.pathname.startsWith('/solar-drift/')) document.getElementById('home').href = '/solar-drift/'
  </script>
</body>
</html>
