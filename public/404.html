<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#080e17" />
  <title>Lost in space · Solar Drift</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <style>
    html, body { margin: 0; height: 100%; }
    body { display: grid; place-items: center; padding: 24px; box-sizing: border-box; background: radial-gradient(circle at 60% 45%, #152a31, #0e1b25 45%, #080e17); color: #e8eee2; font-family: ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
    main { max-width: 440px; }
    p.code { font: 10px ui-monospace, monospace; letter-spacing: .16em; color: #8baba6; margin: 0 0 24px; }
    h1 { font-size: clamp(40px, 9vw, 64px); font-weight: 400; line-height: 1; letter-spacing: -.06em; margin: 0 0 20px; }
    h1 em { font-style: normal; color: #a8c7b3; }
    p { color: #a9bdb5; line-height: 1.6; margin: 0 0 28px; }
    a { display: inline-flex; gap: 40px; justify-content: space-between; background: #d5e7d7; color: #102320; padding: 16px 20px; border-radius: 2px; text-decoration: none; font-weight: 500; }
    a:focus-visible { outline: 2px solid #b9e9d4; outline-offset: 5px; }
  </style>
</head>
<body>
  <main>
    <p class="code">404 · NO ORBIT HERE</p>
    <h1>This page drifted<br /><em>out of range.</em></h1>
    <p>There is nothing at this address. The game is one click away.</p>
    <a id="home" href="/">Back to Solar Drift <span aria-hidden="true">↗</span></a>
  </main>
  <script>
    // The GitHub Pages copy lives under /solar-drift/ rather than at the domain root.
    if (location.pathname.startsWith('/solar-drift/')) document.getElementById('home').href = '/solar-drift/'
  </script>
</body>
</html>
